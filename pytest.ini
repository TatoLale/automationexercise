[pytest]
pythonpath = .
testpaths = tests
filterwarnings =
    ignore:Session-scoped fixtures defined as instance methods:pytest.PytestRemovedIn10Warning
addopts = --alluredir=allure-results --clean-alluredir --reruns 2 --reruns-delay 30 --only-rerun "heavy load" --only-rerun 503 --tracing retain-on-failure