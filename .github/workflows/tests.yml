name: Tests

on:
  push:
    branches: [main]
  pull_request:

jobs:
  tests:
    runs-on: ubuntu-latest

    env:
      AUTOMATIONEXERCISE_EMAIL: ${{ secrets.AUTOMATIONEXERCISE_EMAIL }}
      AUTOMATIONEXERCISE_PASSWORD: ${{ secrets.AUTOMATIONEXERCISE_PASSWORD }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - run: pip install -r requirements.txt

      - run: playwright install --with-deps chromium

      - run: pytest -v